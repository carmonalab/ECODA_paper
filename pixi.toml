[workspace]
authors = ["halterc <chalterbio@gmail.com>"]
channels = ["conda-forge", "bioconda", "pytorch", "nvidia"]
name = "ECODA_paper"
platforms = ["osx-arm64", "linux-64"]
channel-priority = "disabled"

[dependencies]
r-base = "==4.5.2"
python = "3.13.*"

# ==========================================
# CORE R STACK
# ==========================================
conda = ">=26.5.3,<27" # Required for reticulate to detect pixi python
r-remotes = "*"
r-biocmanager = "*"
r-reticulate = "1.45.0.*"
r-locfit = "*"
r-factoextra = ">=2.1.0,<3"
r-ggtext = ">=0.1.2,<0.2"
r-mclust = ">=6.1.3,<7"
r-tidyverse = ">=2.0.0,<3"
r-ncdf4 = ">=1.24,<2"
r-arrow = ">=24.0.0,<25"
r-rfast = ">=2.1.5.2,<3"
r-ggally = ">=2.4.0,<3"
r-hotelling = ">=1.0_8,<2"
r-zcompositions = ">=1.6.2,<2"
# For scITD
bioconductor-edger = "4.8.2.*"
bioconductor-sva = "3.58.0.*"

# Need to use pre-compiled versions, as source compilation might fail
r-igraph = ">=2.3.3,<3"
r-leidenbase = ">=0.1.36,<0.2"

# Use same version as Seurat 5.2.0
r-seuratobject = "5.2.0.*"

# HPC benchmark pipeline (src/5_run_benchmark_methods/run_r_sample_embedding_methods/):
# full load_all_functions.R set + DESeq2 for the R workers. Unversioned so
# bioconda resolves the r-base 4.5.2-compatible "r45" build for DESeq2.
# NOTE: r-robcompositions is linux-64-only on conda-forge (no osx-arm64
# build); it is used only by datrans() (transformation analysis, HPC-only
# since Phase 3.2) and therefore scoped to the cuda13 linux-64 feature.
r-vegan = "*"
bioconductor-deseq2 = "*"
r-doparallel = "*"
r-plotly = "*"
r-pheatmap = "*"

# ==========================================
# CORE PYTHON STACK
# ==========================================
anndata = "==0.12.19"
scanpy = "==1.12.2"
# Python igraph backend for sc.tl.leiden(flavor="igraph"); r-igraph above is
# the R package (unrelated)
python-igraph = ">=0.11,<1"
rpy2 = ">=3.6.7,<4"
# Required by pd.read_feather()/to_feather() in 3.1_merge_annotations.py and
# the benchmark Python workers (1.1.1_benchmark_methods_py.py,
# 1.1.2_merge_execution_times.py); version-aligned with the pinned r-arrow.
pyarrow = ">=24,<26"

[pypi-dependencies]
harmonypy = ">=2.0.0, <3"
scHPL = "==1.0.0" # see https://github.com/theislab/scarches/issues/262
pilotpy = "==2.0.15"
scikit-misc = "==0.5.1"
scvi-tools = "==1.5.0.post1"
scarches = "==0.6.1"
# Python backend of MAGIC imputation (import name "magic"), required by
# Rmagic -> scATOMIC::run_scATOMIC() in the cell type annotation worker
# (2.1.1_process_chunk.R). Without it every scATOMIC attempt fails with
# "ModuleNotFoundError: No module named 'magic'".
magic-impute = "*"
# Python backend of MOFA2 (run_mofa with use_basilisk = FALSE in
# benchmark_methods_r.R::process_mofa_bulk_fig). MOFA2 1.20.2 requires
# mofapy2 0.7.3 in the python binary reticulate uses (py-cuda13 env on HPC);
# without it MOFA runs fail with "mofapy2_0.7.3 is not detected in the
# specified python binary".
mofapy2 = "==0.7.3"


# ==========================================
# HARDWARE TARGETS
# ==========================================

# 1. CPU-Only Target (for MacBook)
[feature.cpu.target.osx-arm64.dependencies]
pytorch = "*"
jax = "*"

# 2. CUDA 13 Target (for HPC)
[feature.cuda13.target.linux-64.dependencies]
pytorch-cuda = { version = "*" }
# linux-64-only (no osx-arm64 build); used by datrans() on the HPC workers
r-robcompositions = "*"
# Hermetic C/C++/Fortran build toolchain for the R source-package compilation
# in [tasks.setup]: worker nodes may not have system gcc/make, and conda
# compilers make R CMD INSTALL node-independent (login node or worker).
compilers = "*"
make = "*"

[feature.cuda13.target.linux-64.pypi-dependencies]
jax = { version = "*", extras = ["cuda13"] }

# ==========================================
# ENVIRONMENTS 
# ==========================================
[environments]
py-cpu = ["cpu"]
py-cuda13 = ["cuda13"]


# ==========================================
# INSTALL OTHER R PACKAGES
# ==========================================
# Installs R packages that are not available pre-compiled (e.g. from GitHub)

[tasks.setup]
cmd = """
Rscript -e "
  options(timeout = 9999999, repos = c(CRAN = 'https://packagemanager.posit.co/cran/latest'))

  # Parallel source compilation: R CMD INSTALL builds with make; MAKEFLAGS=-jN
  # compiles translation units in parallel. Without it every Rcpp-heavy package
  # (Seurat, MOFA2, GloScope, ...) compiles single-threaded and setup takes
  # 15-30+ min regardless of node cores. Cap at 8 on the shared login node;
  # override with the R_SETUP_JOBS env var (e.g. 16 on a dedicated worker).
  setup_jobs <- suppressWarnings(as.integer(Sys.getenv('R_SETUP_JOBS', unset = '')))
  if (is.na(setup_jobs) || setup_jobs < 1) {
    setup_jobs <- min(8, max(2, parallel::detectCores() - 1))
  }
  Sys.setenv(MAKEFLAGS = paste0('-j', setup_jobs))
  cat('Using', setup_jobs, 'parallel compile jobs (MAKEFLAGS)')

  # Keep pre-compiled conda-forge versions (r-igraph, r-leidenbase, ...) and only install
  # missing packages. Without this, remotes upgrades the whole dependency closure from CRAN
  # source (e.g. tries leidenbase 0.1.36 -> 0.1.37 even though Seurat has no version
  # requirement on it), which fails on the HPC due to missing system dev libs.
  Sys.setenv(R_REMOTES_UPGRADE = 'never')
  bioc_repos <- BiocManager::repositories()

  # SHA-pinned GitHub packages (installed directly; remotes checks installed SHA and skips if matching)

  # Basics
  remotes::install_github('satijalab/seurat@e4cc89238b233e46e2cef4a2b866896cf0cb093c')
  remotes::install_github('scverse/anndataR@07612e4f0e5c7efff05265eb916ae9ed94bf78b9')

  # HiTME
  remotes::install_github('carmonalab/SignatuR@0aded1db20d14f47b5b6074fcf5fc9f9c2e6279e')
  remotes::install_github('carmonalab/STACAS@ea34e824e17df6316823db0a9b6322af0833e501')
  remotes::install_github('carmonalab/ProjecTILs@1159e1778820180fd0233bbfc0d7f296e35bd25f')
  remotes::install_github('carmonalab/HiTME@87f8d4147aaa468438df33f50cabf2005ac518bf')

  # scATOMIC
  # yikeshu0611/set does not contain a standard man/ (documentation) directory in its repository. When remotes::install_github attempts to run R CMD build on the source tree, R fails while building the documentation index (cannot open file 'man').
  remotes::install_github('yikeshu0611/set@5360f0b85f0a618d9a05009b8553d397c4add828', build = FALSE)
  if (!requireNamespace('dlm', quietly = TRUE)) remotes::install_version('dlm', version = '1.1-6.1', upgrade = 'never')
  if (!requireNamespace('Rmagic', quietly = TRUE)) remotes::install_version('Rmagic', version = '2.0.3', upgrade = 'never')
  remotes::install_github('inofechm/cutoff.scATOMIC@a43fd5e1e8f0e3b71ec446970e4316f305939a17')
  remotes::install_github('abelson-lab/scATOMIC@d332cd5cf6a1ecef7c32d0adc4a862a4c47bcd95')

  # scITD
  if (!requireNamespace('edgeR', quietly = TRUE)) remotes::install_version('edgeR', version = '4.8.2', repos = bioc_repos, upgrade = 'never')
  if (!requireNamespace('sva', quietly = TRUE)) remotes::install_version('sva', version = '3.58.0', repos = bioc_repos, upgrade = 'never')
  if (!requireNamespace('scITD', quietly = TRUE)) remotes::install_version('scITD', version = '1.0.4', upgrade = 'never')

  if (!requireNamespace('limma', quietly = TRUE)) remotes::install_version('limma', version = '3.68.4', repos = bioc_repos, upgrade = 'never')
  if (!requireNamespace('MOFA2', quietly = TRUE)) remotes::install_version('MOFA2', version = '1.20.2', repos = bioc_repos, upgrade = 'never')
  if (!requireNamespace('GloScope', quietly = TRUE)) remotes::install_version('GloScope', version = '2.0.1', repos = bioc_repos, upgrade = 'never')
  if (!requireNamespace('thisutils', quietly = TRUE)) remotes::install_version('thisutils', version = '0.4.9', upgrade = 'never')
  remotes::install_github('GfellerLab/EPIC@50a4f404f96c2842b2891b517b4e3bfaa6c64b8f')
  remotes::install_github('carmonalab/scECODA@055bc5efb51cac7c3b6e0ea7eae84420f0a8d21a')
  remotes::install_github('funkyheatmap/funkyheatmap@d66dd6d65b4e29fb3f6a300627a4db367ad9db0c')

  # ---------------------------------------------------------------------------
  # Final integrity verification. pixi/conda do NOT verify installed package
  # FILES (a corrupt/partial package dir — e.g. digest/Meta/package.rds missing
  # after a concurrent or interrupted install — is invisible to a plain
  # 'pixi install'), and conda (pixi install) + remotes (this task) both write
  # into the same R library, so corruption can persist silently until a job
  # hits it. Check every installed package has its Meta/package.rds and that
  # the critical load path works; fail loudly with the wipe-and-reinstall
  # repair otherwise.
  # ---------------------------------------------------------------------------
  check_lib_integrity <- function(lib) {
    bad <- character(0)
    for (p in list.dirs(lib, recursive = FALSE)) {
      if (!file.exists(file.path(p, 'DESCRIPTION'))) next
      if (!file.exists(file.path(p, 'Meta', 'package.rds'))) bad <- c(bad, basename(p))
    }
    bad
  }
  bad_pkgs <- unique(unlist(lapply(.libPaths(), check_lib_integrity)))
  if (length(bad_pkgs) > 0) {
    stop(sprintf(
      'R library integrity check FAILED: %d package(s) missing Meta/package.rds (corrupt/partial install): %s. Repair: rm -rf .pixi/envs/py-cuda13 && pixi install -e py-cuda13 && pixi run -e py-cuda13 setup',
      length(bad_pkgs), paste(head(bad_pkgs, 20), collapse = ', ')
    ))
  }
  missing_critical <- c('digest', 'SeuratObject', 'Seurat', 'anndataR')[
    !vapply(c('digest', 'SeuratObject', 'Seurat', 'anndataR'), requireNamespace, logical(1), quietly = TRUE)]
  if (length(missing_critical) > 0) {
    stop(sprintf(
      'R library integrity check FAILED: critical package(s) do not load: %s. Repair: rm -rf .pixi/envs/py-cuda13 && pixi install -e py-cuda13 && pixi run -e py-cuda13 setup',
      paste(missing_critical, collapse = ', ')
    ))
  }
  cat('R library integrity check OK')
"
"""
