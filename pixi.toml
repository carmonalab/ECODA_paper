[workspace]
authors = ["halterc <chalterbio@gmail.com>"]
channels = ["conda-forge", "bioconda", "pytorch", "nvidia"]
name = "ECODA_paper"
platforms = ["osx-arm64", "linux-64"]
channel-priority = "disabled"

[dependencies]
r-base = "==4.5.2"
python = "3.13.*"

# ==========================================
# CORE R STACK
# ==========================================
conda = ">=26.5.3,<27" # Required for reticulate to detect pixi python
r-remotes = "*"
r-biocmanager = "*"
r-reticulate = "1.45.0.*"
r-locfit = "*"
r-factoextra = ">=2.1.0,<3"
r-ggtext = ">=0.1.2,<0.2"
r-mclust = ">=6.1.3,<7"
r-tidyverse = ">=2.0.0,<3"
r-ncdf4 = ">=1.24,<2"
r-arrow = ">=24.0.0,<25"
r-rfast = ">=2.1.5.2,<3"
r-ggally = ">=2.4.0,<3"
r-hotelling = ">=1.0_8,<2"
r-zcompositions = ">=1.6.2,<2"
# For scITD
bioconductor-edger = "4.8.2.*"
bioconductor-sva = "3.58.0.*"

# Need to use pre-compiled versions, as source compilation might fail
r-igraph = ">=2.3.3,<3"
r-leidenbase = ">=0.1.36,<0.2"

# Use same version as Seurat 5.2.0
r-seuratobject = "5.2.0.*"

# HPC benchmark pipeline (src/5_run_benchmark_methods/run_r_sample_embedding_methods/):
# full load_all_functions.R set + DESeq2 for the R workers. Pinned to the
# version used in the pre-pixi renv.lock (DESeq2 1.50.2, Bioc 3.22); the
# r45 build (r-base 4.5.2-compatible) is the only bioconda build for this
# version, so the pin cannot pick a mismatched r4x build.
r-vegan = "*"
bioconductor-deseq2 = "1.50.2.*"
r-doparallel = "*"
r-plotly = "*"
r-pheatmap = "*"
# Notebook-only (benchmark_analysis.rmd): theme_classic2() (Supp fig 2/14/15/16,
# Figure 4 AB) + writexl (raw_data_for_publication.xlsx export) + rmdformats (HTML output template)
r-ggthemes = ">=4.2.0,<6"
r-writexl = ">=1.5.0,<2"
r-rmdformats = "*"

# ==========================================
# CORE PYTHON STACK
# ==========================================
anndata = "==0.12.19"
scanpy = "==1.12.2"
# Python igraph backend for sc.tl.leiden(flavor="igraph"); r-igraph above is
# the R package (unrelated)
python-igraph = ">=0.11,<1"
rpy2 = ">=3.6.7,<4"
# Jupyter kernel for Quarto-rendered onboarding check notebooks
# (notebooks/dataset_onboarding/dataset_check_*.qmd, `jupyter: python3`
# front matter) and the Sikkema Python-qmd precedent. The default-env python
# is registered as the user-level `python3` kernelspec
# (`pixi run -e default jupyter kernelspec install ... --name python3 --user`).
ipykernel = "*"
# Required by pd.read_feather()/to_feather() in 3.1_merge_annotations.py and
# the benchmark Python workers (1.1.1_benchmark_methods_py.py,
# 1.1.2_merge_execution_times.py); version-aligned with the pinned r-arrow.
pyarrow = ">=24,<26"

[pypi-dependencies]
harmonypy = ">=2.0.0, <3"
scHPL = "==1.0.0" # see https://github.com/theislab/scarches/issues/262
pilotpy = "==2.0.15"
scikit-misc = "==0.5.1"
scvi-tools = "==1.5.0.post1"
scarches = "==0.6.1"
# Python backend of MAGIC imputation (import name "magic"), required by
# Rmagic -> scATOMIC::run_scATOMIC() in the cell type annotation worker
# (2.1.1_process_chunk.R). Without it every scATOMIC attempt fails with
# "ModuleNotFoundError: No module named 'magic'".
magic-impute = "*"
# Python backend of MOFA2 (run_mofa with use_basilisk = FALSE in
# benchmark_methods_r.R::process_mofa_bulk_fig). MOFA2 1.20.2 requires
# mofapy2 0.7.3 in the python binary reticulate uses (py-cuda13 env on HPC);
# without it MOFA runs fail with "mofapy2_0.7.3 is not detected in the
# specified python binary".
mofapy2 = "==0.7.3"
# PILOT-GM-VAE benchmark method (CostaLab/PILOT-GM-VAE, BIB 2025); deps
# (torch/numba/joblib/pilotpy/scanpy/sklearn) already in the lockfile.
pilotgm = "==0.1.1"
# Module-level import of the vendored QOT script (qot_utils_re.py,
# PennShenLab/QOT); only used by its trajectory_analysis function, which we
# never call, but the import must resolve.
phate = ">=1.0,<2"


# ==========================================
# HARDWARE TARGETS
# ==========================================

# 1. CPU-Only Target (for MacBook)
[feature.cpu.target.osx-arm64.dependencies]
pytorch = "*"
jax = "*"

# 2. CUDA 13 Target (for HPC)
[feature.cuda13.target.linux-64.dependencies]
pytorch-cuda = { version = "*" }
# Hermetic C/C++/Fortran build toolchain for the R source-package compilation
# in src/utils/setup_r_packages.R: worker nodes may not have system gcc/make,
# and conda compilers make R CMD INSTALL node-independent (login node or worker).
compilers = "*"
r-robcompositions = "*"
make = "*"

[feature.cuda13.target.linux-64.pypi-dependencies]
jax = { version = "*", extras = ["cuda13"] }

# ==========================================
# ENVIRONMENTS 
# ==========================================
[environments]
py-cpu = ["cpu"]
py-cuda13 = ["cuda13"]


# ==========================================
# R SOURCE PACKAGE SETUP
# ==========================================
# Package mutation is implemented by src/utils/setup_r_packages.R and may
# only be invoked through the guarded refresh/setup entry points.

# ==========================================
# MANUAL DEPENDENCY CHECK
# ==========================================
# Repo-wide R env verification (src/utils/env_check.R: requireNamespace over
# the notebook attach list ∪ namespaced-only ∪ worker/annotation packages —
# no attach, no install). Manual login-node command, NOT wired into any
# submitter (archived-plan decision): `pixi run -e py-cuda13 check-r-deps`
# (HPC) or `pixi run -e default check-r-deps` (macOS; HPC-only packages will
# be reported as missing — expected). Run from the project root.
[tasks.check-r-deps]
cmd = "Rscript -e 'source(\"src/utils/env_check.R\")'"
